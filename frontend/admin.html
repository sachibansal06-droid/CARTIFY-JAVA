<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartify | Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f6fa;
            color: #18181b;
        }

        .navbar {
            height: 75px;
            background: #18181b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .admin-label {
            color: #bbb;
            margin-left: 10px;
            font-size: 14px;
        }

        .logout-btn {
            border: none;
            background: #6c4df6;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
        }

        .container {
            width: 88%;
            max-width: 1250px;
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome p {
            color: #777;
            margin-top: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .stat-card span {
            font-size: 30px;
        }

        .stat-card p {
            color: #777;
            margin-top: 12px;
        }

        .stat-card h2 {
            margin-top: 5px;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 24px;
        }

        .add-btn {
            border: none;
            background: #6c4df6;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
        }

        .product-card h3 {
            margin-bottom: 8px;
        }

        .product-card p {
            color: #777;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .price {
            font-size: 18px;
            font-weight: 800;
            margin: 12px 0;
        }

        .delete-btn {
            width: 100%;
            border: none;
            background: #ffecec;
            color: #d93025;
            padding: 10px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .delete-btn:hover {
            background: #ffd9d9;
        }

        .order-card {
            border: 1px solid #eee;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .order-card strong {
            color: #6c4df6;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            background: #eaf8ef;
            color: #218838;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
        }

        .empty {
            color: #777;
            padding: 10px 0;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.open {
            display: flex;
        }

        .modal-box {
            width: 450px;
            max-width: 92%;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }

        .modal-box h2 {
            margin-bottom: 20px;
        }

        .input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            margin-bottom: 12px;
            outline: none;
        }

        .save-btn {
            width: 100%;
            border: none;
            background: #6c4df6;
            color: white;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .cancel-btn {
            width: 100%;
            border: none;
            background: #eee;
            color: #333;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 10px;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .admin-label {
                display: none;
            }

            .container {
                width: 92%;
            }

            .stats,
            .product-grid {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 20px;
            }
        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="logo">
        🛍️ Cartify
        <span class="admin-label">Admin Dashboard</span>
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</header>


<main class="container">


    <div class="welcome">

        <h1>Welcome, Admin 👋</h1>

        <p>
            Manage your Cartify store from one place.
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">
            <span>📦</span>
            <p>Total Products</p>
            <h2 id="productCount">0</h2>
        </div>

        <div class="stat-card">
            <span>👥</span>
            <p>Total Customers</p>
            <h2 id="customerCount">0</h2>
        </div>

        <div class="stat-card">
            <span>🛒</span>
            <p>Cart Items</p>
            <h2 id="cartCount">0</h2>
        </div>

        <div class="stat-card">
            <span>📋</span>
            <p>Total Orders</p>
            <h2 id="orderCount">0</h2>
        </div>

    </div>


    <!-- PRODUCTS -->

    <section class="section">

        <div class="section-header">

            <h2>📦 Product Management</h2>

            <button
                class="add-btn"
                onclick="openAddProduct()">

                + Add Product

            </button>

        </div>

        <div
            id="productGrid"
            class="product-grid">

        </div>

    </section>


    <!-- ORDERS -->

    <section class="section">

        <div class="section-header">

            <h2>📋 Recent Orders</h2>

        </div>

        <div id="ordersContainer">

            <p class="empty">
                Loading orders...
            </p>

        </div>

    </section>


</main>


<!-- ADD PRODUCT MODAL -->

<div
    id="productModal"
    class="modal">

    <div class="modal-box">

        <h2>Add New Product</h2>

        <input
            id="productName"
            class="input"
            placeholder="Product name">

        <input
            id="productDescription"
            class="input"
            placeholder="Product description">

        <input
            id="productPrice"
            class="input"
            type="number"
            placeholder="Price">

        <input
            id="productStock"
            class="input"
            type="number"
            placeholder="Stock">

        <button
            class="save-btn"
            onclick="addProduct()">

            Add Product

        </button>

        <button
            class="cancel-btn"
            onclick="closeAddProduct()">

            Cancel

        </button>

    </div>

</div>


<script>

const API = "http://localhost:8080/api";


/* CHECK ADMIN LOGIN */

const user =
    JSON.parse(localStorage.getItem("cartifyUser"));


if (!user || user.role !== "ADMIN") {

    alert("Admin login required.");

    window.location.href = "login.html";

}


/* LOAD PRODUCTS */

async function loadProducts() {

    try {

        const response =
            await fetch(`${API}/products`);

        const products =
            await response.json();

        document.getElementById("productCount")
            .textContent = products.length;


        const grid =
            document.getElementById("productGrid");


        if (products.length === 0) {

            grid.innerHTML =
                `<p class="empty">No products available.</p>`;

            return;
        }


        grid.innerHTML =
            products.map(product => `

                <div class="product-card">

                    <h3>${product.name}</h3>

                    <p>
                        ${product.description || "No description"}
                    </p>

                    <div class="price">
                        ₹${Number(product.price)
                            .toLocaleString("en-IN")}
                    </div>

                    <p>
                        Stock:
                        <strong>${product.stock}</strong>
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${product.id})">

                        🗑️ Delete Product

                    </button>

                </div>

            `).join("");

    } catch (error) {

        console.error(error);

    }

}


/* DELETE PRODUCT */

async function deleteProduct(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this product?");

    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API}/products/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (response.ok) {

            alert("Product deleted successfully!");

            loadProducts();

        } else {

            alert("Unable to delete product.");

        }

    } catch (error) {

        console.error(error);

        alert("Backend is not connected.");

    }

}


/* OPEN MODAL */

function openAddProduct() {

    document
        .getElementById("productModal")
        .classList
        .add("open");

}


/* CLOSE MODAL */

function closeAddProduct() {

    document
        .getElementById("productModal")
        .classList
        .remove("open");

}


/* ADD PRODUCT */

async function addProduct() {

    const name =
        document.getElementById("productName").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const price =
        Number(document.getElementById("productPrice").value);

    const stock =
        Number(document.getElementById("productStock").value);


    if (!name || !price || stock < 0) {

        alert("Please enter valid product details.");

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/products`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        description: description,
                        price: price,
                        stock: stock
                    })
                }
            );


        if (!response.ok) {

            alert("Unable to add product.");

            return;

        }


        alert("Product added successfully!");


        document.getElementById("productName").value = "";
        document.getElementById("productDescription").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productStock").value = "";


        closeAddProduct();

        loadProducts();

    } catch (error) {

        console.error(error);

        alert("Backend is not connected.");

    }

}


/* LOAD ORDERS */

async function loadOrders() {

    try {

        const response =
            await fetch(`${API}/orders`);

        const orders =
            await response.json();


        document.getElementById("orderCount")
            .textContent = orders.length;


        const container =
            document.getElementById("ordersContainer");


        if (orders.length === 0) {

            container.innerHTML =
                `<p class="empty">No orders yet.</p>`;

            return;

        }


        container.innerHTML =
            orders.map(order => `

                <div class="order-card">

                    <strong>
                        Order #${order.id}
                    </strong>

                    <p>
                        Customer ID: ${order.customerId}
                    </p>

                    <p>
                        Total:
                        ₹${Number(order.totalAmount)
                            .toLocaleString("en-IN")}
                    </p>

                    <span class="status">
                        ${order.status}
                    </span>

                </div>

            `).join("");


    } catch (error) {

        console.error(error);

    }

}


/* LOAD CUSTOMERS */

async function loadCustomers() {

    try {

        const response =
            await fetch(`${API}/customers`);

        const customers =
            await response.json();


        document.getElementById("customerCount")
            .textContent = customers.length;

    } catch (error) {

        console.error(error);

    }

}


/* LOAD CART */

async function loadCartCount() {

    try {

        const response =
            await fetch(`${API}/cart`);

        const cart =
            await response.json();


        document.getElementById("cartCount")
            .textContent = cart.reduce(
                (sum, item) =>
                    sum + item.quantity,
                0
            );

    } catch (error) {

        console.error(error);

    }

}


/* LOGOUT */

function logout() {

    localStorage.removeItem("cartifyUser");

    window.location.href = "login.html";

}


/* START */

loadProducts();
loadOrders();
loadCustomers();
loadCartCount();

</script>


</body>

</html>
